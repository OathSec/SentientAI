name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Ruff (format)
        run: ruff format --check src tests
      - name: Mypy (strict)
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sentient
          POSTGRES_PASSWORD: sentient
          POSTGRES_DB: sentientai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentient" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SENTIENT_TEST_POSTGRES_URL: postgresql+asyncpg://sentient:sentient@127.0.0.1:5432/sentientai
      SENTIENT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pull sandbox image
        run: docker pull python:3.12-slim
      - name: Tests (unit + integration against Postgres, Redis, Docker)
        run: pytest -q -rs --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  evals-scripted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: docker pull python:3.12-slim
      - name: Scripted evaluation suite
        env:
          SENTIENT_MODELS__EMBEDDING__PROVIDER: hashing
          SENTIENT_WEB__SEARCH_BACKEND: disabled
        run: sentientai eval run --scripted --output reports/evals-scripted.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-scripted
          path: reports/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sentientai:ci
          load: true
      - name: Smoke test image
        run: |
          docker run --rm sentientai:ci version
          docker run --rm sentientai:ci --help
