<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SentientAI Console</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2330; --muted: #637083; --line: #e3e7ee;
    --accent: #3b5bdb; --ok: #2b8a3e; --warn: #e67700; --bad: #c92a2a; --bar: #dbe4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a; --panel: #1a1f28; --text: #e6e9ef; --muted: #93a0b4; --line: #2a313d;
      --accent: #748ffc; --ok: #51cf66; --warn: #ffa94d; --bad: #ff6b6b; --bar: #2c3550;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); border-color: var(--bad); }
  main { display: grid; gap: 16px; padding: 16px 20px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  section h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .bar { display: grid; grid-template-columns: 90px 1fr 44px; gap: 8px; align-items: center; margin: 4px 0; }
  .track { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); }
  .muted { color: var(--muted); }
  ul { margin: 0; padding-left: 18px; } li { margin: 3px 0; overflow-wrap: anywhere; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); border-color: var(--bad); }
  .approval { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .approval code { display: block; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px;
                   max-height: 120px; overflow: auto; margin: 6px 0; }
  #chatlog { height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .msg { margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; } .msg b { color: var(--accent); }
  form { display: flex; gap: 8px; margin-top: 8px; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 6px 10px; border-radius: 6px;
                     border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #events { height: 260px; overflow-y: auto; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  #events div { border-bottom: 1px dashed var(--line); padding: 2px 0; overflow-wrap: anywhere; }
  .wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <div><h1 id="name">Fuzzy</h1><span class="muted" id="sub">connecting…</span></div>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="pill ok" id="ks">running</span>
    <button class="danger" id="kill">Kill switch</button>
    <button id="resume">Resume</button>
  </div>
</header>
<main>
  <section><h2>Inner state</h2><div id="feeling" class="muted"></div><div id="affect"></div></section>
  <section><h2>Awareness</h2><ul id="awareness"></ul><h2 style="margin-top:14px">Goals</h2><ul id="goals"></ul></section>
  <section><h2>Pending approvals</h2><div id="approvals" class="muted">none</div></section>
  <section class="wide"><h2>Conversation</h2><div id="chatlog"></div>
    <form id="chatform"><input type="text" id="chatinput" placeholder="Say something…" autocomplete="off">
    <button class="primary">Send</button></form></section>
  <section class="wide"><h2>Live events</h2><div id="events"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = null;
try { token = localStorage.getItem("sentient_token"); } catch (e) {}
const session = "dashboard-" + Math.random().toString(36).slice(2, 8);
let eventsStarted = false;

async function api(path, opts = {}) {
  const headers = Object.assign({"Content-Type": "application/json"}, opts.headers || {});
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  if (res.status === 401) {
    token = prompt("API token:");
    try { localStorage.setItem("sentient_token", token || ""); } catch (e) {}
    return api(path, opts);
  }
  if (!res.ok) throw new Error(res.status + " " + await res.text());
  return res.json();
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function refresh() {
  try {
    const s = await api("/v1/state");
    $("name").textContent = s.name;
    $("sub").textContent = `awakening #${s.boot_count} · autonomy ${s.autonomy} · ` +
      `${s.track_record.succeeded} succeeded / ${s.track_record.failed} failed`;
    $("ks").textContent = s.kill_switch.engaged ? "KILLED: " + s.kill_switch.reason : "running";
    $("ks").className = "pill " + (s.kill_switch.engaged ? "bad" : "ok");
    $("feeling").textContent = s.feeling;
    $("affect").innerHTML = Object.entries(s.affect).map(([k, v]) => {
      const pct = k === "valence" || k === "mood" ? (v + 1) * 50 : v * 100;
      return `<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${pct.toFixed(0)}%"></div></div><span class="muted">${v.toFixed(2)}</span></div>`;
    }).join("");
    $("awareness").innerHTML = s.awareness.map(p => `<li><span class="muted">${esc(p.source)}</span> ${esc(p.content)}</li>`).join("") || '<li class="muted">quiet</li>';
    $("goals").innerHTML = s.goals.map(g => `<li>${esc(g.description)} <span class="muted">(${esc(g.origin)}, ${(g.progress*100).toFixed(0)}%)</span></li>`).join("") || '<li class="muted">none</li>';
    const approvals = await api("/v1/approvals");
    $("approvals").innerHTML = approvals.map(a => `<div class="approval"><b>${esc(a.tool)}</b> <span class="pill">${esc(a.risk)}</span>
      <code>${esc(JSON.stringify(a.arguments, null, 1))}</code><div class="muted">${esc(a.reasons.join("; "))}</div>
      <div style="margin-top:6px;display:flex;gap:6px"><button class="primary" onclick="decide('${a.id}', true)">Approve</button>
      <button class="danger" onclick="decide('${a.id}', false)">Deny</button></div></div>`).join("") || "none";
    if (!eventsStarted) { eventsStarted = true; connectEvents(); }  // token is known once a call succeeded
  } catch (e) { $("sub").textContent = "error: " + e.message; }
}
async function decide(id, approve) { await api(`/v1/approvals/${id}`, {method: "POST", body: JSON.stringify({approve})}); refresh(); }
window.decide = decide;
$("kill").onclick = async () => { const reason = prompt("Reason for emergency stop:", "operator stop"); if (reason) { await api("/v1/kill", {method: "POST", body: JSON.stringify({reason})}); refresh(); } };
$("resume").onclick = async () => { await api("/v1/resume", {method: "POST"}); refresh(); };
$("chatform").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $("chatinput").value.trim(); if (!text) return;
  $("chatinput").value = "";
  const log = $("chatlog");
  log.insertAdjacentHTML("beforeend", `<div class="msg"><b>you</b> ${esc(text)}</div>`);
  log.scrollTop = log.scrollHeight;
  try {
    const r = await api("/v1/chat", {method: "POST", body: JSON.stringify({message: text, session_id: session})});
    const conf = r.confidence == null ? "" : ` <span class="muted">(confidence ${r.confidence.toFixed(2)})</span>`;
    log.insertAdjacentHTML("beforeend", `<div class="msg"><b>${esc($("name").textContent)}</b>${conf} ${esc(r.answer)}</div>`);
  } catch (e) { log.insertAdjacentHTML("beforeend", `<div class="msg muted">error: ${esc(e.message)}</div>`); }
  log.scrollTop = log.scrollHeight;
};
function connectEvents() {
  const src = new EventSource("/v1/events" + (token ? "?token=" + encodeURIComponent(token) : ""));
  src.onmessage = (m) => {
    const e = JSON.parse(m.data);
    const el = $("events");
    el.insertAdjacentHTML("afterbegin", `<div>${esc(e.ts.slice(11, 19))} <b>${esc(e.type)}</b> ${esc(JSON.stringify(e.payload)).slice(0, 300)}</div>`);
    while (el.childElementCount > 300) el.lastChild.remove();
    if (/^(approval|task|safety|goal)\./.test(e.type)) refresh();
  };
  src.onerror = () => { src.close(); setTimeout(connectEvents, 3000); };
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
