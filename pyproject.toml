[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sentientai"
version = "0.1.0"
description = "SentientAI: a local, persistent, autonomous cognitive runtime."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "SentientAI contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
qdrant = ["qdrant-client>=1.10"]
documents = ["pypdf>=4.0", "beautifulsoup4>=4.12"]
all = [
    "asyncpg>=0.29",
    "redis>=5.0",
    "qdrant-client>=1.10",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
]
dev = [
    "sentientai[all]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
sentientai = "sentientai.cli:main"

[project.urls]
Repository = "https://github.com/oathsec/sentientai"

[tool.hatch.build.targets.wheel]
packages = ["src/sentientai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "worker"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "C4"]
ignore = [
    "S101",   # assert is fine in tests and invariants
    "S603",   # subprocess without shell is intentional (sandbox, git)
    "S607",   # partial executable paths (docker, git) are resolved from PATH by design
    "RUF012", # pydantic/class-level defaults
    "B008",   # typer/fastapi call defaults
    "ASYNC109", # explicit timeout parameters are part of our public API
    "ASYNC240", # small stat/mkdir calls are fine inline; heavy scans use to_thread
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RET", "SIM117", "PT018", "ASYNC110", "E501"]
"evals/**" = ["S"]
"src/sentientai/prompts.py" = ["E501"]           # prompt text is not code
"src/sentientai/memory/vector.py" = ["S608"]     # table name is a class constant

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
mypy_path = "src"
packages = ["sentientai"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "pypdf.*", "bs4.*", "asyncpg.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["worker"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires external services (Postgres, Redis, Docker); skipped when unavailable",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["sentientai"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
